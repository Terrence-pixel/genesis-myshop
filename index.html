<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis My Shop</title>
  <link rel="manifest" href="/manifest.json"> 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
    <!-- Auth screen -->
    <div id="auth-screen" class="screen">
      <div class="pin-box">
        <h2>Genesis My Shop</h2>
        <p id="auth-title">Sign in to your shop</p>
        
        <div id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••">
          </div>
          <button class="primary" onclick="handleLogin()">Sign In</button>
          <p style="margin-top:16px;font-size:14px;color:#666;">
            Don't have an account? 
            <a href="#" onclick="showSignup()" style="color:#22c55e;">Sign up</a>
          </p>
        </div>
        
        <div id="signup-form" style="display:none;">
          <div class="form-group">
            <label>Shop Name / Jina la Duka</label>
            <input type="text" id="signup-shopname" placeholder="Duka Langu">
          </div>
          <div class="form-group">
            <label>Phone / Simu</label>
            <input type="tel" id="signup-phone" placeholder="0712 345 678">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signup-password" placeholder="Min 6 characters">
          </div>
          <button class="primary" onclick="handleSignup()">Create Account</button>
          <p style="margin-top:16px;font-size:14px;color:#666;">
            Already have an account? 
            <a href="#" onclick="showLogin()" style="color:#22c55e;">Sign in</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Main app -->
    <div id="main-app" class="screen hidden">
      <div style="padding:12px 16px;background:#22c55e;color:white;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:12px;opacity:0.9;">Genesis My Shop</div>
          <div id="shop-name-display" style="font-size:16px;font-weight:600;">My Shop</div>
        </div>
        <button onclick="signOut()" style="background:rgba(255,255,255,.2);border:none;color:white;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;">
          Logout
        </button>
      </div>
      
      <nav id="bottom-nav">
        <button onclick="showScreen('sell')" class="nav-btn active">Uza</button>
        <button onclick="showScreen('debts')" class="nav-btn">Madeni</button>
        <button onclick="showScreen('dayend')" class="nav-btn">Siku</button>
        <button onclick="showScreen('products')" class="nav-btn">Bidhaa</button>
      </nav>
      
      <div id="sell-screen" class="screen-content"></div>
      <div id="debts-screen" class="screen-content hidden"></div>
      <div id="dayend-screen" class="screen-content hidden"></div>
      <div id="products-screen" class="screen-content hidden"></div>
    </div>
  </div>

  <script src="/js/db.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/screens.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
